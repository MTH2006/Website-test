# ========================================================
# KIND CLUSTER CONFIGURATION FOR MINI CAAS PLATFORM
# Cluster Name: caas-cluster
# CNI: Calico NetworkPolicy support
# ========================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: caas-cluster
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    listenAddress: "127.0.0.1"
    protocol: TCP
