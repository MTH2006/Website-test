# ========================================================
# KUBERNETES VALIDATING ADMISSION POLICY (VAP)
# Whitelists approved container images (nginx, alpine, busybox, redis)
# Rejects unauthorized images (e.g. untrusted/malicious/crypto-miner)
# Supported natively in Kubernetes 1.30+
# ========================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-whitelist-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  validations:
    - expression: "object.spec.containers.all(c, c.image.startsWith('nginx') || c.image.startsWith('alpine') || c.image.startsWith('busybox') || c.image.startsWith('redis') || c.image.startsWith('docker.io/library/nginx') || c.image.startsWith('docker.io/library/alpine') || c.image.startsWith('docker.io/library/busybox'))"
      message: "Admission Denied by Mini CaaS Policy: Container image is not in the approved whitelist (allowed: nginx, alpine, busybox, redis)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-whitelist-binding
spec:
  policyName: image-whitelist-policy
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
      - key: team
        operator: In
        values: ["team-a", "team-b", "team-c"]
