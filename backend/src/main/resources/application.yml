server:
  port: 8088

spring:
  application:
    name: mini-caas-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/minicaas
    username: minicaas_admin
    password: minicaas_secure_pass_2026
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: MiniCaaSSecretKeyForDemoProjectAuthentication2026MustBeAtLeast32BytesLongForSecurityHS256
    expiration-ms: 86400000 # 24 hours
  k8s:
    cluster-name: caas-cluster
    default-namespaces:
      - team-a
      - team-b
      - team-c

logging:
  level:
    root: INFO
    com.minicaas: DEBUG
    org.springframework.security: INFO
